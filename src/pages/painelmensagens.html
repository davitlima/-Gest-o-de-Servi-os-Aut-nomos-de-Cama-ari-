<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>Nexlar – Mensagens</title>
  <link rel="stylesheet" href="/src/css/painelmensagens.css" />
  <link rel="stylesheet" href="/src/css/responsive.css" />
  <link rel="stylesheet" href="/src/css/panel-nav.css" />
  <link rel="stylesheet" href="/src/css/page-transition.css" />
  <script src="/src/js/panel-nav.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  <script src="/src/js/api.js" defer></script>
  <script src="/src/js/avatar-ui.js" defer></script>
  <script src="/src/js/chat-core.js" defer></script>
  <script src="/src/js/painelmensagens.js" defer></script>
  <script src="/src/js/page-transition.js" defer></script>
</head>
<body>

  <nexlar-panel-nav active="mensagens"></nexlar-panel-nav>

  <div class="main-wrapper">

    <section class="messages-panel" id="messagesPanel">
      <h1 class="panel-title">Mensagens</h1>

      <div class="search-wrapper">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"/>
          <line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <input type="search" class="search-input" placeholder="Buscar conversas..." id="searchInput" aria-label="Buscar conversas" />
      </div>

      <ul class="conversation-list" id="conversationList" aria-live="polite"></ul>
    </section>

    <section class="chat-area" id="chatArea">
      <div class="empty-state" id="emptyState">
        <div class="empty-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
          </svg>
        </div>
        <h2 class="empty-title">Selecione uma conversa</h2>
        <p class="empty-sub">Escolha um contato para iniciar ou continuar a conversa</p>
      </div>

      <div class="chat-view" id="chatView" style="display:none;">
        <div class="chat-header" id="chatHeader">
          <button class="back-btn" id="backBtn" aria-label="Voltar">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="15 18 9 12 15 6"/>
            </svg>
          </button>
          <div class="chat-header-avatar" id="chatHeaderAvatar"></div>
          <div>
            <a class="chat-header-name" id="chatHeaderName" href="#"></a>
            <div class="chat-header-status" id="connectionStatus" role="status" aria-live="polite">Conectando…</div>
          </div>
        </div>

        <div class="chat-messages" id="chatMessages" aria-live="polite" aria-relevant="additions"></div>

        <div class="chat-input-bar">
          <input type="text" class="chat-input" id="chatInput" placeholder="Digite sua mensagem..." aria-label="Mensagem" maxlength="4000" autocomplete="off" />
          <button class="send-btn" id="sendBtn" aria-label="Enviar">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="22" y1="2" x2="11" y2="13"/>
              <polygon points="22 2 15 22 11 13 2 9 22 2"/>
            </svg>
          </button>
        </div>
        <div class="contratar-bar">
          <button class="contratar-btn" id="contratarBtn">Contratar Serviço</button>
        </div>
      </div>
    </section>

  </div>

  <button class="help-btn" aria-label="Ajuda">?</button>

  <script src="/src/js/deferred-widgets.js" defer></script>
</body>
</html>
