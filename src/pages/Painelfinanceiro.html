<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nexlar – Painel do Autônomo</title>
  <link rel="stylesheet" href="/src/css/Painelfinanceiro.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js" defer></script>
  <script src="/src/js/Painelfinanceiro.js" defer></script>
</head>
<body>

<!-- SIDEBAR -->
<aside class="sidebar">
  <div class="logo">
    <img src="/src/images/image_c3ad5e85-removebg-preview 1.png" alt="logo" class="logo-img-dashboard">
  </div>
  <nav>
    <a href="#" class="nav-link active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>Início
    </a>
    <a href="#" class="nav-link">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>Meu Perfil
    </a>
    <a href="#" class="nav-link">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/></svg>Financeiro
    </a>
    <a href="#" class="nav-link">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>Mensagem
    </a>
  </nav>
</aside>

<!-- MAIN -->
<main class="main">
  <header class="top-bar">
    <h1>Painel do Autônomo</h1>
    <button class="btn-primary" id="openModal">+ Adicionar Registro</button>
  </header>

  <!-- KPI CARDS -->
  <section class="kpi-row">
    <div class="card kpi-card">
      <div class="card-header">
        <div class="icon-wrap icon-blue">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg>
        </div>
        <div class="icon-wrap icon-green">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>
        </div>
      </div>
      <p class="kpi-label">Ganho do Mês</p>
      <p class="kpi-value" id="ganhoMes">R$ 0,00</p>
    </div>
    <div class="card kpi-card">
      <div class="card-header">
        <div class="icon-wrap icon-green">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>
        </div>
        <div class="icon-wrap icon-green">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>
        </div>
      </div>
      <p class="kpi-label">Média mensal</p>
      <p class="kpi-value" id="mediaMensal">R$ 0,00</p>
    </div>
    <div class="card kpi-card">
      <div class="card-header">
        <div></div>
        <div class="icon-wrap icon-purple">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>
        </div>
      </div>
      <p class="kpi-label">Meta mensal</p>
      <div class="progress-track">
        <div class="progress-fill" id="progressFill" style="width:0%"></div>
      </div>
      <div class="progress-info">
        <span id="progressLabel">R$ 0,00 / R$ 5.000,00</span>
        <span id="progressPct">0%</span>
      </div>
    </div>
  </section>

  <!-- CHARTS -->
  <section class="chart-row">
    <div class="card chart-card">
      <h3>Ganhos</h3>
      <canvas id="barChart"></canvas>
    </div>
    <div class="card chart-card">
      <h3>Vendas</h3>
      <canvas id="lineChart"></canvas>
    </div>
  </section>

  <!-- HISTORY -->
  <section class="history-section">
    <h3>Histórico de Serviços</h3>
    <div id="historyList">
      <p class="empty-state">Nenhum registro ainda. Clique em "Adicionar Registro".</p>
    </div>
  </section>
</main>

<!-- ======= MODAL ADICIONAR / EDITAR ======= -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-header">
      <h2 id="modalTitle">Adicionar Registro</h2>
      <button class="modal-close" id="closeModal">&times;</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label>Nome do Serviço</label>
        <input type="text" id="fNome" placeholder="Ex: Instalação Elétrica - Centro" />
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Categoria</label>
          <select id="fCategoria">
            <option value="">Selecione</option>
            <option>Serviço Residencial</option>
            <option>Instalação Elétrica</option>
            <option>Manutenção Preventiva</option>
            <option>Serviço Comercial</option>
            <option>Outro</option>
          </select>
        </div>
        <div class="form-group">
          <label>Mês</label>
          <select id="fMes">
            <option value="0">Janeiro</option>
            <option value="1">Fevereiro</option>
            <option value="2">Março</option>
            <option value="3">Abril</option>
            <option value="4">Maio</option>
            <option value="5">Junho</option>
            <option value="6">Julho</option>
            <option value="7">Agosto</option>
            <option value="8">Setembro</option>
            <option value="9">Outubro</option>
            <option value="10">Novembro</option>
            <option value="11">Dezembro</option>
          </select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Valor (R$)</label>
          <input type="number" id="fValor" placeholder="0,00" min="0" step="0.01" />
        </div>
        <div class="form-group">
          <label>Data</label>
          <input type="date" id="fData" />
        </div>
      </div>
      <div class="form-group">
        <label>Cliente / Local</label>
        <input type="text" id="fCliente" placeholder="Ex: Inocoop, Gleba A..." />
      </div>
      <div class="form-group">
        <label>Status</label>
        <select id="fStatus">
          <option>Concluído</option>
          <option>Em andamento</option>
          <option>Pendente</option>
        </select>
      </div>
      <div class="form-group">
        <label>Observações</label>
        <textarea id="fObs" rows="2" placeholder="Detalhes adicionais..."></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-secondary" id="cancelModal">Cancelar</button>
      <button class="btn-primary" id="saveModal">Salvar Registro</button>
    </div>
  </div>
</div>

<!-- ======= MODAL INSPECIONAR ======= -->
<div class="modal-overlay" id="inspectOverlay">
  <div class="modal">
    <div class="modal-header">
      <h2>Detalhes do Serviço</h2>
      <button class="modal-close" id="closeInspect">&times;</button>
    </div>
    <div class="modal-body" id="inspectBody"></div>
    <div class="modal-footer" style="justify-content:space-between">
      <button class="btn-danger" id="deleteRecord">🗑 Excluir</button>
      <div style="display:flex;gap:10px">
        <button class="btn-secondary" id="closeInspect2">Fechar</button>
        <button class="btn-primary" id="editRecord">✏ Editar</button>
      </div>
    </div>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

</body>
</html>
