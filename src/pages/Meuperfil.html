<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="/src/css/Meuperfil.css">
</head>
<body>

<div class="overlay" id="overlay" onclick="closeSidebar()"></div>

  <button class="sidebar-close" onclick="closeSidebar()" aria-label="Fechar menu">×</button>

  <div class="sidebar-logo">
    <img src="/src/images/logobranca.png" alt="Logo Nexlar" class="imagem-logo">
  </div>

  <nav class="sidebar-nav">
    <a href="/src/pages/inicio.html" class="nav-item" data-page="inicio">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z" />
        <polyline points="9 22 9 12 15 12 15 22" />
      </svg>
      <span>Início</span>
    </a>

    <a href="Meuperfil.html" class="nav-item active" data-page="perfil">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2" />
        <circle cx="12" cy="7" r="4" />
      </svg>
      <span>Meu Perfil</span>
    </a>

    <a href="Painelfinanceiro.html" class="nav-item" data-page="financeiro">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="12" y1="1" x2="12" y2="23"></line>
        <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path>
      </svg>
      <span>Financeiro</span>
    </a>

    <a href="painelmensagens.html" class="nav-item" data-page="mensagem">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" />
      </svg>
      <span>Mensagem</span>
    </a>
  </nav>
</aside>

<main class="container">

  <!-- Header mobile com hambúrguer -->
  <div class="mobile-header">
    <button class="hamburger" onclick="openSidebar()" aria-label="Abrir menu">
      <span></span><span></span><span></span>
    </button>
    <span class="mobile-title">Nexlar</span>
  </div>

  <header class="top-header">
    <div>
      <h1>Meu Perfil</h1>
      <p>Gerencie suas informações e configurações</p>
    </div>
    <div class="header-actions">
      <button class="btn btn-outline">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
          <path fill-rule="evenodd" d="M10 12.5a.5.5 0 0 1-.5.5h-8a.5.5 0 0 1-.5-.5v-9a.5.5 0 0 1 .5-.5h8a.5.5 0 0 1 .5.5v2a.5.5 0 0 0 1 0v-2A1.5 1.5 0 0 0 9.5 2h-8A1.5 1.5 0 0 0 0 3.5v9A1.5 1.5 0 0 0 1.5 14h8a1.5 1.5 0 0 0 1.5-1.5v-2a.5.5 0 0 0-1 0z"/>
          <path fill-rule="evenodd" d="M15.854 8.354a.5.5 0 0 0 0-.708l-3-3a.5.5 0 0 0-.708.708L14.293 7.5H5.5a.5.5 0 0 0 0 1h8.793l-2.147 2.146a.5.5 0 0 0 .708.708z"/>
        </svg>
        <span>Sair</span>
      </button>
      <button class="btn btn-danger">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
          <path d="M6.5 1h3a.5.5 0 0 1 .5.5v1H6v-1a.5.5 0 0 1 .5-.5M11 2.5v-1A1.5 1.5 0 0 0 9.5 0h-3A1.5 1.5 0 0 0 5 1.5v1H1.5a.5.5 0 0 0 0 1h.538l.853 10.66A2 2 0 0 0 4.885 16h6.23a2 2 0 0 0 1.994-1.84l.853-10.66h.538a.5.5 0 0 0 0-1zm1.958 1-.846 10.58a1 1 0 0 1-.997.92h-6.23a1 1 0 0 1-.997-.92L3.042 3.5zm-7.487 1a.5.5 0 0 1 .528.47l.5 8.5a.5.5 0 0 1-.998.06L5 5.03a.5.5 0 0 1 .47-.53Zm5.058 0a.5.5 0 0 1 .47.53l-.5 8.5a.5.5 0 1 1-.998-.06l.5-8.5a.5.5 0 0 1 .528-.47M8 4.5a.5.5 0 0 1 .5.5v8.5a.5.5 0 0 1-1 0V5a.5.5 0 0 1 .5-.5"/>
        </svg>
        <span>Excluir Conta</span>
      </button>
    </div>
  </header>

  <nav class="tabs">
    <button class="tab active">Informações Pessoais</button>
    <button class="tab">Portfólio</button>
  </nav>

  <section class="profile-card">
    <div class="profile-photo">
      <div class="avatar">JS</div>
      <button class="btn-photo">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
          <path d="M15 12a1 1 0 0 1-1 1H2a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h1.172a3 3 0 0 0 2.12-.879l.83-.828A1 1 0 0 1 6.827 3h2.344a1 1 0 0 1 .707.293l.828.828A3 3 0 0 0 12.828 5H14a1 1 0 0 1 1 1zM2 4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2h-1.172a2 2 0 0 1-1.414-.586l-.828-.828A2 2 0 0 0 9.172 2H6.828a2 2 0 0 0-1.414.586l-.828.828A2 2 0 0 1 3.172 4z"/>
          <path d="M8 11a2.5 2.5 0 1 1 0-5 2.5 2.5 0 0 1 0 5m0 1a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7M3 6.5a.5.5 0 1 1-1 0 .5.5 0 0 1 1 0"/>
        </svg>
        <span>Alterar Foto</span>
      </button>
    </div>

    <h3>Dados Pessoais</h3>

    <form class="profile-form">
      <div class="form-row">
        <div class="form-group">
          <label>Nome Completo</label>
          <input type="text" value="João Pedro Silva">
        </div>
        <div class="form-group">
          <label>Telefone</label>
          <input type="text" value="(71) 98856-2546">
        </div>
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" value="joaopedro@email.com">
      </div>
      <div class="form-group">
        <label>Endereço / Bairro</label>
        <input type="text" value="Centro, Campinas - SA">
      </div>
      <div class="form-group">
        <label>Sobre você</label>
        <textarea rows="5">Eletricista com 10 anos de experiência.</textarea>
      </div>
      <button type="submit" class="btn-save">Salvar Anotações</button>
    </form>
  </section>

</main>

<div vw class="enabled">
  <div vw-access-button class="active"></div>
  <div vw-plugin-wrapper>
    <div class="vw-plugin-top-wrapper"></div>
  </div>
</div>

<script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
<script>
  new window.VLibras.Widget('https://vlibras.gov.br/app');
</script>

<script>
  function openSidebar() {
    document.getElementById('sidebar').classList.add('open');
    document.getElementById('overlay').classList.add('visible');
  }
  function closeSidebar() {
    document.getElementById('sidebar').classList.remove('open');
    document.getElementById('overlay').classList.remove('visible');
  }
</script>
<script>
(function(d){
    var s = d.createElement("script");
    s.src = "https://cdn.userway.org/widget.js";
    (d.body || d.head).appendChild(s);
})(document);
</script>
<script src="/src/js/Meuperfil.js"></script>
</body>
</html>
