<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Meu Perfil - Nexlar</title>

  <link rel="stylesheet" href="/src/css/Meuperfil.css">
  <link rel="stylesheet" href="/src/css/responsive.css">
  <link rel="stylesheet" href="/src/css/panel-nav.css" />
  <link rel="stylesheet" href="/src/css/page-transition.css" />
  <script src="/src/js/panel-nav.js" defer></script>
</head>

<body>

    <nexlar-panel-nav active="perfil"></nexlar-panel-nav>

    <main class="container">

        <header class="top-header">
            <div>
                <h1>Meu Perfil</h1>
                <p>Gerencie suas informações e configurações</p>
            </div>

            <div class="header-actions">
                <button class="btn btn-outline">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-box-arrow-right" viewBox="0 0 16 16">
                        <path fill-rule="evenodd" d="M10 12.5a.5.5 0 0 1-.5.5h-8a.5.5 0 0 1-.5-.5v-9a.5.5 0 0 1 .5-.5h8a.5.5 0 0 1 .5.5v2a.5.5 0 0 0 1 0v-2A1.5 1.5 0 0 0 9.5 2h-8A1.5 1.5 0 0 0 0 3.5v9A1.5 1.5 0 0 0 1.5 14h8a1.5 1.5 0 0 0 1.5-1.5v-2a.5.5 0 0 0-1 0z" />
                        <path fill-rule="evenodd" d="M15.854 8.354a.5.5 0 0 0 0-.708l-3-3a.5.5 0 0 0-.708.708L14.293 7.5H5.5a.5.5 0 0 0 0 1h8.793l-2.147 2.146a.5.5 0 0 0 .708.708z" />
                    </svg>
                    <span>Sair</span>
                </button>

                <button class="btn btn-danger">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-trash3" viewBox="0 0 16 16">
                        <path d="M6.5 1h3a.5.5 0 0 1 .5.5v1H6v-1a.5.5 0 0 1 .5-.5M11 2.5v-1A1.5 1.5 0 0 0 9.5 0h-3A1.5 1.5 0 0 0 5 1.5v1H1.5a.5.5 0 0 0 0 1h.538l.853 10.66A2 2 0 0 0 4.885 16h6.23a2 2 0 0 0 1.994-1.84l.853-10.66h.538a.5.5 0 0 0 0-1zm1.958 1-.846 10.58a1 1 0 0 1-.997.92h-6.23a1 1 0 0 1-.997-.92L3.042 3.5zm-7.487 1a.5.5 0 0 1 .528.47l.5 8.5a.5.5 0 0 1-.998.06L5 5.03a.5.5 0 0 1 .47-.53Zm5.058 0a.5.5 0 0 1 .47.53l-.5 8.5a.5.5 0 1 1-.998-.06l.5-8.5a.5.5 0 0 1 .528-.47M8 4.5a.5.5 0 0 1 .5.5v8.5a.5.5 0 0 1-1 0V5a.5.5 0 0 1 .5-.5" />
                    </svg>
                    <span>Excluir Conta</span>
                </button>
            </div>
        </header>

        <nav class="tabs">
            <button class="tab active">Informações Pessoais</button>
            <button class="tab" id="portfolioTab">Portfólio</button>
        </nav>

        <section class="profile-card">

            <div class="profile-photo">
                <div class="avatar">?</div>
                <button class="btn-photo" type="button" aria-haspopup="dialog" aria-controls="avatarUploadModal">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-camera" viewBox="0 0 16 16">
                        <path d="M15 12a1 1 0 0 1-1 1H2a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h1.172a3 3 0 0 0 2.12-.879l.83-.828A1 1 0 0 1 6.827 3h2.344a1 1 0 0 1 .707.293l.828.828A3 3 0 0 0 12.828 5H14a1 1 0 0 1 1 1zM2 4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2h-1.172a2 2 0 0 1-1.414-.586l-.828-.828A2 2 0 0 0 9.172 2H6.828a2 2 0 0 0-1.414.586l-.828.828A2 2 0 0 1 3.172 4z" />
                        <path d="M8 11a2.5 2.5 0 1 1 0-5 2.5 2.5 0 0 1 0 5m0 1a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7M3 6.5a.5.5 0 1 1-1 0 .5.5 0 0 1 1 0" />
                    </svg>
                    <span>Alterar Foto</span>
                </button>
            </div>

            <h3>Dados Pessoais</h3>

            <form class="profile-form">
                <div class="form-row">
                    <div class="form-group">
                        <label>Nome Completo</label>
                        <input type="text" id="profileName" required>
                    </div>

                    <div class="form-group">
                        <label>Telefone</label>
                        <input type="text" id="profilePhone">
                    </div>
                </div>

                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="profileEmail" readonly>
                </div>

                <div class="form-group">
                    <label>Endereço / Bairro</label>
                    <input type="text" id="profileNeighborhood">
                </div>

                <div class="form-group">
                    <label>Sobre você</label>
                    <textarea rows="5" id="profileBio"></textarea>
                </div>

                <button type="submit" class="btn-save">
                    Salvar Anotações
                </button>
            </form>

        </section>

    </main>

    <div class="avatar-modal" id="avatarUploadModal" role="dialog" aria-modal="true" aria-labelledby="avatarUploadTitle" hidden>
        <section class="avatar-modal__panel" aria-describedby="avatarUploadDescription">
            <header class="avatar-modal__header">
                <div>
                    <h2 id="avatarUploadTitle">Alterar foto de perfil</h2>
                    <p id="avatarUploadDescription">Escolha uma imagem nítida de até 5 MB.</p>
                </div>
                <button class="avatar-modal__close" id="closeAvatarUpload" type="button" aria-label="Fechar painel">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" /></svg>
                </button>
            </header>

            <button class="avatar-dropzone" id="avatarDropzone" type="button">
                <span class="avatar-dropzone__preview" id="avatarUploadPreview" aria-hidden="true">
                    <svg viewBox="0 0 24 24"><path d="M12 16V4m0 0L7.5 8.5M12 4l4.5 4.5M5 14v4a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-4" /></svg>
                </span>
                <strong>Arraste sua foto para cá</strong>
                <span>ou clique para selecionar no dispositivo</span>
                <small id="avatarFileName">JPG, PNG, GIF ou WebP · máximo de 5 MB</small>
            </button>
            <input id="avatarFileInput" type="file" accept="image/jpeg,image/png,image/gif,image/webp" hidden>

            <p class="avatar-upload-message" id="avatarUploadMessage" role="status" aria-live="polite"></p>

            <footer class="avatar-modal__actions">
                <button class="avatar-action avatar-action--secondary" id="cancelAvatarUpload" type="button">Cancelar</button>
                <button class="avatar-action avatar-action--primary" id="saveAvatarUpload" type="button" disabled>Salvar foto</button>
            </footer>
        </section>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/src/js/api.js"></script>
    <script src="/src/js/profile-upload-core.js"></script>
    <script src="/src/js/Meuperfil.js"></script>
    <script src="/src/js/page-transition.js"></script>
</body>

</html>
