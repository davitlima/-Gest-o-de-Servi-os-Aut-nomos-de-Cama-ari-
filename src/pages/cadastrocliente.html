<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nexlar — Cadastro do Cliente</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/src/css/cadastrocliente.css" />
</head>
<body>
 
  <div class="toast" id="toast"></div>

  <div class="logo-container">
      <img src="/src/images/logobranca.png" alt="Nexlar" class="logo-img" />
  </div>

  <div class="card">
    <div class="card-header">
      <p class="welcome">Bem-vindos ao Nexlar!</p>
      <h1>Cadastro do Cliente</h1>
    </div>
 
    <form onsubmit="event.preventDefault(); handleSubmit();">
      <div class="fields">
  
        <div class="field">
          <span class="field-icon">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 9.5L12 3l9 6.5V20a1 1 0 01-1 1H4a1 1 0 01-1-1V9.5z"/>
              <polyline points="9 21 9 12 15 12 15 21"/>
            </svg>
          </span>
          <input type="text" id="nome" placeholder="Nome completo" autocomplete="name" required />
        </div>
  
        <div class="field">
          <span class="field-icon">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="4" width="18" height="18" rx="2"/>
              <line x1="16" y1="2" x2="16" y2="6"/>
              <line x1="8"  y1="2" x2="8"  y2="6"/>
              <line x1="3"  y1="10" x2="21" y2="10"/>
            </svg>
          </span>
          <input type="text" id="nascimento" placeholder="Data de nascimento"
                 oninput="maskDate(this)" maxlength="10" required />
        </div>
  
        <div class="field">
          <span class="field-icon">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <rect x="4" y="2" width="16" height="20" rx="2"/>
              <line x1="8" y1="6" x2="16" y2="6"/><line x1="8" y1="10" x2="16" y2="10"/><line x1="8" y1="14" x2="16" y2="14"/>
            </svg>
          </span>
          <input type="text" id="cpf" placeholder="CPF"
                 oninput="maskCPF(this)" maxlength="14" required />
        </div>
  
        <div class="field">
          <span class="field-icon">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M22 16.92v3a2 2 0 01-2.18 2A19.86 19.86 0 013.09 4.18 2 2 0 015.06 2h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11L9.09 9.91a16 16 0 006.99 6.99l1.27-1.27a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 16.92z"/>
            </svg>
          </span>
          <input type="tel" id="contato" placeholder="Contato"
                 oninput="maskPhone(this)" maxlength="15" required />
        </div>
  
        <div class="field">
          <span class="field-icon">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/>
            </svg>
          </span>
          <input type="password" id="senha" placeholder="Senha" required />
        </div>
  
      </div>

      <div class="terms-wrap">
        <input type="checkbox" id="termos" required />
        <label for="termos">Aceito os Termos de Uso</label>
      </div>
  
      <button type="submit" class="btn-continuar" id="btnContinuar">
        Continuar
      </button>
    </form>
 
  </div>

  <button class="btn-help" onclick="showHelp()" title="Ajuda">?</button>
 
      <div vw class="enabled">
    <div vw-access-button class="active"></div>
    <div vw-plugin-wrapper>
        <div class="vw-plugin-top-wrapper"></div>
    </div>
  </div>

<script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>

<script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
<script>
    new window.VLibras.Widget({
        rootPath: 'https://vlibras.gov.br/app',
        position: 'R' 
    });
</script>


<script type="text/javascript">
(function(d){
    var s = d.createElement("script");
    s.setAttribute("data-account", "S9u6Q9zXrg"); 
    s.setAttribute("data-size", "small"); 
    s.setAttribute("data-position", 6); 

    s.src = "https://cdn.userway.org/widget.js";
    (d.body || d.head).appendChild(s);
})(document);
</script>

</body>
</html>
