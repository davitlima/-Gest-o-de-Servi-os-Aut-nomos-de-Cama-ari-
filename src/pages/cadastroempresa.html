
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexlar - Cadastro</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="/src/css/cadastroempresa.css">
</head>
<body>

    <div class="container">
        <header class="logo-header">
              <div class="logo-container">
      <img src="/src/images/logobranca.png" alt="Nexlar" class="logo-img" />
  </div>
        </header>

        <main class="card">
            <h3>Bem-vindos ao Nexlar!</h3>
            <h2>Cadastro da Empresa</h2>

            <form>
                <div class="input-group">
                    <i class="fa-regular fa-building"></i>
                    <input type="text" placeholder="Nome da Empresa" required>
                </div>

                <div class="input-group">
                    <i class="fa-regular fa-id-card"></i>
                    <input type="text" placeholder="CNPJ" required>
                </div>

                <div class="input-group">
                    <i class="fa-solid fa-phone"></i>
                    <input type="tel" placeholder="Contato" required>
                </div>

                <div class="input-group">
                    <i class="fa-solid fa-location-dot"></i>
                    <input type="password" placeholder="Senha" required>
                </div>

                <div class="checkbox-group">
                    <input type="checkbox" id="terms" required>
                    <label for="terms">Aceito os Termos de Uso</label>
                </div>

                <button type="submit" class="btn-continue">Continuar</button>
            </form>
        </main>
    </div>

        <div vw class="enabled">
    <div vw-access-button class="active"></div>
    <div vw-plugin-wrapper>
        <div class="vw-plugin-top-wrapper"></div>
    </div>
  </div>

<script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>

<script>
    new window.VLibras.Widget('https://vlibras.gov.br/app');
</script>
<script>
(function(d){
    var s = d.createElement("script");
    s.src = "https://cdn.userway.org/widget.js";
    (d.body || d.head).appendChild(s);
})(document);
</script>
</body>
</html>
